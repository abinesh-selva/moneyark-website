    <!-- Preconnect for Material Symbols icon font only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /* Critical styles for the initial loader */
      body { margin: 0; background: #0E2A47; }
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0E2A47;
        z-index: 9999;
        font-family: sans-serif;
      }
      .loader-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loader-bar {
        width: 120px;
        height: 2px;
        background: rgba(240, 160, 145, 0.15);
        border-radius: 4px;
        overflow: hidden;
      }
      .loader-progress {
        width: 40%;
        height: 100%;
        background: #F0A091;
        border-radius: 4px;
        animation: slide 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.95); }
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="bg-background selection:bg-primary-container/30 selection:text-primary-container">
    <div id="root">
      <!-- Initial Loading State -->
      <div class="initial-loader">
        <img src="/logo.png" alt="MoneyArk" class="loader-logo">
        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>

    <!-- Static Fallback for SEO Crawlers (Hidden from users with JS) -->
    <noscript>

          <li><strong>Asset Management:</strong> Track savings, investments, and expenses in one dashboard.</li>
          <li><strong>Cloud Synchronization:</strong> Secure real-time sync via Supabase.</li>
          <li><strong>Privacy First:</strong> Offline-first storage with SQLite and biometric app lock.</li>
          <li><strong>Smart Analytics:</strong> Interactive financial charts and category-based reports.</li>
          <li><strong>Multi-Currency Support:</strong> Support for over 15 major currencies.</li>
        </ul>
        <p>Download MoneyArk for Android now – The simplest way to manage your personal finances.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
